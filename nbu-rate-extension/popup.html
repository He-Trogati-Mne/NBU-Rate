<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      width: 420px;
      padding: 18px 20px;
      font-size: 15px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      color: var(--accent);
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover {
      background: var(--hover);
      color: var(--text);
    }
    .icon-btn svg {
      display: block;
      width: 18px;
      height: 18px;
    }

    .rate-row {
      display: grid;
      grid-template-columns: 48px 44px 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
    }
    .rate-row:last-child { border-bottom: none; }

    .rate-row .flag { margin: 0; }
    .rate-row .currency-code {
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 14px;
      color: var(--text);
    }
    .rate-row .currency-name {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rate-row .rate-value {
      font-weight: 700;
      color: var(--positive);
      text-align: right;
      font-size: 15px;
      white-space: nowrap;
    }

    .rate-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      white-space: nowrap;
      justify-content: flex-end;
    }
    .rate-change.up   { color: var(--positive); background: color-mix(in srgb, var(--positive) 15%, transparent); }
    .rate-change.down { color: var(--negative); background: color-mix(in srgb, var(--negative) 15%, transparent); }
    .rate-change.flat { color: var(--text-muted); background: color-mix(in srgb, var(--text-muted) 12%, transparent); }

    .change-arrow { font-size: 1.15em; line-height: 1; font-weight: 900; }

    .updated {
      margin-top: 14px;
      font-size: 13px;
      color: var(--text-faint);
      text-align: center;
    }
    .error {
      color: var(--negative);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
    }
    .loader {
      text-align: center;
      font-size: 15px;
      color: var(--text-muted);
      padding: 12px 0;
    }

    /* Великий шрифт у попапі */
    :root[data-a11y-font="true"] body { width: 520px; }
    :root[data-a11y-font="true"] .rate-row {
      grid-template-columns: 60px 54px 1fr auto auto;
      gap: 12px;
      padding: 14px 0;
      font-size: 17px;
    }
    :root[data-a11y-font="true"] .rate-row .currency-code { font-size: 16px; }
    :root[data-a11y-font="true"] .rate-row .currency-name { font-size: 15px; }
    :root[data-a11y-font="true"] .rate-row .rate-value { font-size: 17px; }
    :root[data-a11y-font="true"] .rate-change {
      font-size: 15px;
      padding: 6px 12px;
    }
    :root[data-a11y-font="true"] .change-arrow { font-size: 1.3em; }
    :root[data-a11y-font="true"] .change-symbol { font-size: 1.15em; }
    :root[data-a11y-font="true"] .change-label { font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="header">
    <h1 data-i18n="popup_title">Курс НБУ до гривні</h1>
    <button id="open-settings" class="icon-btn"
            data-i18n-title="settings_tooltip" title="Налаштування">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

  </div>

  <div id="content">
    <div class="loader" data-i18n="loading">Завантаження...</div>
  </div>

  <div id="updated" class="updated"></div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
