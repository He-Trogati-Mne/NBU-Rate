<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    * { box-sizing: border-box; }

    body {
      width: 420px;
      height: 560px;
      margin: 0;
      padding: 0;
      font-size: 15px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      color: var(--accent);
    }
    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .icon-btn:hover {
      background: var(--hover);
      color: var(--text);
      text-decoration: none;
    }
    .icon-btn svg {
      display: block;
      width: 18px;
      height: 18px;
    }

    /* Контент — скролиться, скрол майже невидимий */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 20px 12px;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color 0.3s;
    }
    #content:hover {
      scrollbar-color: color-mix(in srgb, var(--text-muted) 30%, transparent) transparent;
    }
    #content::-webkit-scrollbar {
      width: 6px;
    }
    #content::-webkit-scrollbar-track {
      background: transparent;
    }
    #content::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 3px;
      transition: background 0.2s;
    }
    #content:hover::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text-muted) 30%, transparent);
    }
    #content::-webkit-scrollbar-thumb:hover {
      background: color-mix(in srgb, var(--text-muted) 50%, transparent);
    }

    #updated {
      flex-shrink: 0;
      padding: 10px 20px 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-faint);
      text-align: center;
      background: var(--bg);
    }
    #updated:empty {
      display: none;
    }

    .rate-row {
      display: grid;
      grid-template-columns: 48px 44px 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
    }
    .rate-row:last-child { border-bottom: none; }

    .rate-row .flag { margin: 0; }
    .rate-row .currency-code {
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 14px;
      color: var(--text);
    }
    .rate-row .currency-name {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rate-row .rate-value {
      font-weight: 700;
      color: var(--positive);
      text-align: right;
      font-size: 15px;
      white-space: nowrap;
    }

    .rate-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      white-space: nowrap;
      justify-content: flex-end;
    }
    .rate-change.up   { color: var(--positive); background: color-mix(in srgb, var(--positive) 15%, transparent); }
    .rate-change.down { color: var(--negative); background: color-mix(in srgb, var(--negative) 15%, transparent); }
    .rate-change.flat { color: var(--text-muted); background: color-mix(in srgb, var(--text-muted) 12%, transparent); }

    .change-arrow { font-size: 1.15em; line-height: 1; font-weight: 900; }

    .error {
      color: var(--negative);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
    }
    .loader {
      text-align: center;
      font-size: 15px;
      color: var(--text-muted);
      padding: 12px 0;
    }

    :root[data-a11y-font="true"] body { width: 520px; height: 640px; }
    :root[data-a11y-font="true"] .rate-row {
      grid-template-columns: 60px 54px 1fr auto auto;
      gap: 12px;
      padding: 14px 0;
      font-size: 17px;
    }
    :root[data-a11y-font="true"] .rate-row .currency-code { font-size: 16px; }
    :root[data-a11y-font="true"] .rate-row .currency-name { font-size: 15px; }
    :root[data-a11y-font="true"] .rate-row .rate-value { font-size: 17px; }
    :root[data-a11y-font="true"] .rate-change {
      font-size: 15px;
      padding: 6px 12px;
    }
    :root[data-a11y-font="true"] .change-arrow { font-size: 1.3em; }
    :root[data-a11y-font="true"] .change-symbol { font-size: 1.15em; }
    :root[data-a11y-font="true"] .change-label { font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="header">
    <h1 data-i18n="popup_title">Курс НБУ до гривні</h1>
    <div class="header-actions">
      <a href="https://he-trogati-mne.github.io/NBU-Rate/" target="_blank" rel="noopener"
         class="icon-btn" data-i18n-title="website_tooltip" title="Сайт">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
      </a>
      <button id="open-settings" class="icon-btn"
              data-i18n-title="settings_tooltip" title="Налаштування">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="content">
    <div class="loader" data-i18n="loading">Завантаження...</div>
  </div>

  <div id="updated" class="updated"></div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
