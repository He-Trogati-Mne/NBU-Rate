<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="options_title">Налаштування — Курс НБУ</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { padding: 32px; max-width: 680px; margin: 0 auto; }

    h1 { font-size: 22px; margin: 0 0 24px; color: var(--accent); }
    h2 { font-size: 15px; margin: 0 0 12px; color: var(--text); }
    section {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }

    .segmented {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-wrap: wrap;
    }
    .segmented button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 9px 18px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .segmented button:hover { background: var(--hover); color: var(--text); }
    .segmented button.active { background: var(--accent); color: #fff; }

    /* Кастомні кольори */
    #custom-colors {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      display: none;
    }
    #custom-colors.visible { display: block; }

    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .color-row label {
      width: 90px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .color-row input[type="color"] {
      width: 40px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: var(--bg);
      padding: 2px;
    }
    .color-row input[type="text"] {
      width: 110px;
      padding: 6px 10px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-transform: uppercase;
    }
    .color-row input[type="text"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 0;
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }
    .presets .label {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 4px;
    }
    .preset-swatch {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: transform 0.1s;
      padding: 0;
    }
    .preset-swatch:hover { transform: scale(1.1); }

    .reset-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .reset-btn:hover { background: var(--hover); color: var(--text); }

    /* Валюти */
    .currency-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 6px 16px;
    }
.currency-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 6px;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
}
    .currency-item:hover { background: var(--hover); }
    .currency-item input { cursor: pointer; accent-color: var(--accent); }
.currency-item code {
  font-weight: 600;
  color: var(--accent);
  min-width: 44px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
}
    .currency-item .cname {
      color: var(--text-muted);
      font-size: 13px;
    }

    .saved-note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--positive);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .saved-note.show { opacity: 1; }
  </style>
</head>
<body>
  <h1 data-i18n="options_title">⚙ Налаштування</h1>

  <section>
    <h2 data-i18n="section_theme">Тема оформлення</h2>
    <div class="segmented" id="theme-switch">
      <button data-theme="light"  data-i18n="theme_light">Світла</button>
      <button data-theme="dark"   data-i18n="theme_dark">Темна</button>
      <button data-theme="system" data-i18n="theme_system">Системна</button>
      <button data-theme="custom" data-i18n="theme_custom">Власна</button>
    </div>

    <div id="custom-colors">
      <h2 style="margin-top:0;" data-i18n="section_custom_colors">Власні кольори</h2>

      <div class="color-row">
        <label data-i18n="color_bg">Фон</label>
        <input type="color" id="color-bg" value="#1a1a1a" />
        <input type="text" id="hex-bg" value="#1a1a1a" maxlength="7" spellcheck="false" />
      </div>

      <div class="color-row">
        <label data-i18n="color_text">Текст</label>
        <input type="color" id="color-text" value="#e8eaed" />
        <input type="text" id="hex-text" value="#e8eaed" maxlength="7" spellcheck="false" />
      </div>

      <div class="color-row">
        <label data-i18n="color_accent">Акцент</label>
        <input type="color" id="color-accent" value="#8ab4f8" />
        <input type="text" id="hex-accent" value="#8ab4f8" maxlength="7" spellcheck="false" />
      </div>

      <div class="presets">
        <span class="label" data-i18n="color_preset_label">Швидкі пресети:</span>
        <button class="preset-swatch" data-preset="midnight" title="Midnight"
                style="background: linear-gradient(135deg,#0f172a 50%,#38bdf8 50%);"></button>
        <button class="preset-swatch" data-preset="nord" title="Nord"
                style="background: linear-gradient(135deg,#2e3440 50%,#88c0d0 50%);"></button>
        <button class="preset-swatch" data-preset="dracula" title="Dracula"
                style="background: linear-gradient(135deg,#282a36 50%,#bd93f9 50%);"></button>
        <button class="preset-swatch" data-preset="sepia" title="Sepia"
                style="background: linear-gradient(135deg,#f4ecd8 50%,#8b5a2b 50%);"></button>
        <button class="preset-swatch" data-preset="forest" title="Forest"
                style="background: linear-gradient(135deg,#0f2417 50%,#4ade80 50%);"></button>
        <button class="preset-swatch" data-preset="rose" title="Rose"
                style="background: linear-gradient(135deg,#fff1f2 50%,#e11d48 50%);"></button>
        <button class="reset-btn" id="reset-colors" data-i18n="color_reset">Скинути</button>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="section_language">Мова</h2>
    <div class="segmented" id="lang-switch">
      <button data-lang="uk" data-i18n="lang_uk">Українська</button>
      <button data-lang="en" data-i18n="lang_en">English</button>
    </div>
  </section>

  <section>
    <h2 data-i18n="section_currencies">Валюти</h2>
    <div class="currency-grid" id="currency-grid"></div>
    <div class="saved-note" id="saved-note" data-i18n="saved">✓ Збережено</div>
  </section>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
